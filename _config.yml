# Site Author
author:
  name: "Aidan Sirbu"
  tagline: "PhD Student @ Mila + McGill University | Paradigms of Intelligence Team @ Google"
  avatar: "profile.png"
  og_image: "icon.jpg"
  bio-short: >-
    My research interests lie at the intersection of deep learning, robotics, and computational neuroscience. My main focus is building embodied agents to investigate theories of motor control and sensorimotor learning. I also work on iterative and self-organizing computation, where repeatedly applying one simple update lets a model keep improving the longer it runs.
  bio: >-
    <p>I am a PhD student at Mila – Quebec AI Institute and McGill University, supervised by <a href='https://mila.quebec/en/directory/blake-richards' target='_blank' rel='noopener noreferrer'>Dr. Blake A. Richards</a>, and a student researcher on the Paradigms of Intelligence team at Google.</p>

    <p>Both halves of my work come down to the same question: what does a system actually have to compute in order to act well? On the embodied side, I build simulated animals faithful enough that theories of motor control can be validated against measured behaviour. On the other, I study models that solve problems by repetition, where one shared update run to arbitrary depth does the work usually handed to search or to scale.</p>
    
    <p>Before I joined Mila, I completed my BSc in Medical Physics at Western University where I worked on projects related to hyperpolarized MRI.</p>

    <p>In my free time, I am an avid rock climber, hiker, and motorcycle rider.</p>

    <p>Don't hesitate to reach out if you are interested in collaborating, discussing research, or even just chatting!</p>
  location: "Montréal, Canada"
  affiliation_line: "Mila · McGill · Google Paradigms of Intelligence"
