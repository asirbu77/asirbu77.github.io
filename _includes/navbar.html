<nav class="nav">
  <a class="nav__brand" href="{{ '/' | relative_url }}">{{ site.author.name | upcase }}</a>
  {% for node in site.data.navbar %}
  <a class="nav__link{% if page.title == node.title %} is-current{% endif %}" href="{{ node.url | relative_url }}">{{ node.title }}</a>
  {% endfor %}
  <span class="nav__social">
    <a href="mailto:{{ site.author.email }}" data-copy-email="{{ site.author.email }}" aria-label="Copy {{ site.author.name }}'s email address"><i class="fa-solid fa-envelope" aria-hidden="true"></i></a>
    {% for node in site.author.social %}
    <a href="{{ node[1] }}" target="_blank" rel="noopener noreferrer" aria-label="{{ node[0] }}"><i class="fa-brands fa-{{ node[0] }}" aria-hidden="true"></i></a>
    {% endfor %}
  </span>
</nav>
